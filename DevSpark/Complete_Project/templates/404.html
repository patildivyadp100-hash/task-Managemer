{% extends "base.html" %}

{% block title %}404 — Page Not Found — TaskFlow{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Page or Resource Not Found</h1>
        <p class="error-message">
            {{ message or "The page or item you are looking for does not exist or may have been moved." }}
        </p>
        <div class="error-actions">
            <a href="{{ url_for('tasks.home') }}" class="btn btn-primary">Go to Dashboard</a>
            <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">Browse Tasks</a>
        </div>
    </div>
</div>
{% endblock %}
